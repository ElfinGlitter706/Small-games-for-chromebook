<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dead Sector: Standalone 3D FPS</title>
<style>
:root{--amber:#ffc857;--red:#ff4d4d;--green:#63ff8d;--panel:rgba(5,9,14,.93)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050709;color:#fff;font-family:Consolas,monospace}canvas{display:block}.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#26313b,#050709 70%)}.card{width:min(920px,92vw);padding:30px;border:2px solid var(--amber);background:var(--panel);box-shadow:0 0 35px #000}.card h1{margin:0 0 8px;color:var(--amber);letter-spacing:.12em}.muted{color:#aab3bd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px;margin:20px 0}.choice,.btn{padding:16px;text-align:left;color:#fff;background:#111a22;border:1px solid #52606d;cursor:pointer;font:inherit}.choice:hover,.choice.selected,.btn:hover{border-color:var(--amber);background:#26313b}.btn{display:inline-block;text-align:center;padding:12px 18px}.hidden{display:none!important}#hud{position:fixed;inset:0;z-index:5;pointer-events:none;text-shadow:2px 2px #000}#stats{position:absolute;left:20px;top:18px;font-size:18px;line-height:1.55}#ammo{position:absolute;right:24px;bottom:22px;text-align:right;font-size:22px}#round{position:absolute;right:24px;top:20px;color:var(--red);font-size:25px}#prompt{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);color:var(--amber);font-size:17px;text-align:center}#message{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:24px;color:var(--green)}#crosshair{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%)}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff}#crosshair:before{left:7px;width:2px;height:16px}#crosshair:after{top:7px;width:16px;height:2px}#healthBar{width:190px;height:12px;border:1px solid #fff}#healthFill{height:100%;background:var(--red)}#cheats{position:fixed;z-index:30;right:18px;top:18px;width:280px;padding:18px;background:#09110d;border:2px solid #44ff78;box-shadow:0 0 24px #1cff5a;color:#77ff9a}#cheats button{width:100%;margin:5px 0;padding:10px;background:#10251a;color:#8fffae;border:1px solid #49d46e;cursor:pointer}#damage{position:fixed;inset:0;z-index:4;pointer-events:none;background:#b00;opacity:0;transition:opacity .1s}kbd{border:1px solid #aaa;padding:1px 5px;border-radius:3px}.tiny{font-size:12px;color:#9eabb7}
</style></head>
<body>
<div id="modeScreen" class="screen"><div class="card"><h1>DEAD SECTOR</h1><p class="muted">Select operational mode</p><div class="grid"><button class="choice" data-mode="power"><b>POWER REQUIRED</b><br><span class="muted">Restore the Power Room switch before advanced machines operate.</span></button><button class="choice" data-mode="classic"><b>CLASSIC FREE-PLAY</b><br><span class="muted">Global power is online from spawn.</span></button></div></div></div>
<div id="loadoutScreen" class="screen hidden"><div class="card"><h1>PRE-GAME LOADOUT</h1><p>Starting gun</p><div class="grid" id="gunChoices"><button class="choice selected" data-gun="m1911"><b>M1911</b><br><span class="muted">Silver • low damage • fast reload • infinite reserve</span></button><button class="choice" data-gun="rk5"><b>RK5</b><br><span class="muted">Dark metal • moderate damage • fast semi-auto • limited reserve</span></button></div><p>Tactical equipment</p><div class="grid" id="tacticalChoices"><button class="choice selected" data-tactical="frag"><b>FRAG GRENADES [G]</b><br><span class="muted">3-second fuse • 15s cooldown</span></button><button class="choice" data-tactical="acid"><b>ACID GRENADE [F]</b><br><span class="muted">Contact puddle • 20s cooldown</span></button><button class="choice" data-tactical="sentry"><b>SENTRY TURRET [V]</b><br><span class="muted">30s defense • 60s cooldown</span></button></div><button id="start" class="btn">DEPLOY</button></div></div>
<div id="hud" class="hidden"><div id="stats">POINTS <span id="points">500</span><br>HEALTH <span id="health">100</span><div id="healthBar"><div id="healthFill"></div></div><span id="power">POWER: OFF</span></div><div id="round">ROUND <span id="roundNum">1</span></div><div id="prompt"></div><div id="message"></div><div id="crosshair"></div><div id="ammo"><span id="weaponName">M1911</span><br><span id="clip">8</span> / <span id="reserve">∞</span><div class="tiny">WASD move • Shift sprint • Space jump • E interact • R reload • Q swap</div></div></div><div id="damage"></div>
<div id="cheats" class="hidden"><b>◆ DEVELOPER CHEAT PANEL ◆</b><p class="tiny">EASTER EGG ACTIVE</p><button id="maxPoints">GIVE MAX POINTS</button><button id="godMode">GOD MODE: OFF</button><button id="unlockDoors">UNLOCK ALL DOORS</button><button id="rayGun">SPAWN RAY GUN</button><button id="closeCheats">CLOSE / RESUME</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js';
let scene,camera,renderer,clock,gameStarted=false,mode='classic',selectedGun='m1911',selectedTactical='frag';
const keysPressed={}; const collisionObstacles=[]; const interactives=[]; const zombies=[]; const projectiles=[]; const hazards=[]; const turrets=[];
const player={position:new THREE.Vector3(0,1.7,13),radius:.6,height:1.7,yVelocity:0,grounded:true,health:100,points:500,god:false,sprintSpeed:7.8,walkSpeed:4.5};
let yaw=0,pitch=0,powerOn=false,round=1,killsThisRound=0,roundTarget=6,nextSpawn=0,isReloading=false,isFiring=false,reloadTimer=null,currentWeapon=0,lastTime=0,isEasterEggActive=false,nearestInteractive=null;
let seqIndex=0; const secret=['KeyY','KeyU','KeyI','KeyO','KeyP']; const cooldowns={frag:0,acid:0,sentry:0};
const weapons={m1911:{name:'M1911',damage:34,clipMax:8,currentClip:8,reserveAmmo:Infinity,fireRate:220,reload:1350,color:0xc7ced6},rk5:{name:'RK5',damage:52,clipMax:15,currentClip:15,reserveAmmo:90,fireRate:135,reload:1800,color:0x292d33},ray:{name:'RAY GUN',damage:220,clipMax:20,currentClip:20,reserveAmmo:160,fireRate:300,reload:1800,color:0x39ff66}}; let inventory=[];
const $=id=>document.getElementById(id); const mat=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,emissive:e,roughness:.7});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$('modeScreen').classList.add('hidden');$('loadoutScreen').classList.remove('hidden')});
function selectGroup(id,key){document.querySelectorAll('#'+id+' .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(key==='gun')selectedGun=b.dataset.gun;else selectedTactical=b.dataset.tactical})}selectGroup('gunChoices','gun');selectGroup('tacticalChoices','tactical');$('start').onclick=startGame;
function startGame(){ $('loadoutScreen').classList.add('hidden');$('hud').classList.remove('hidden');inventory=[selectedGun];powerOn=mode==='classic';init();gameStarted=true;updateHUD();renderer.domElement.requestPointerLock(); }
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x080b0d);scene.fog=new THREE.Fog(0x080b0d,20,58);camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,100);camera.rotation.order='YXZ';camera.position.copy(player.position);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.insertBefore(renderer.domElement,document.body.firstChild);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0x8ca6bf,0x18130f,1.2));const sun=new THREE.DirectionalLight(0xffe7c0,1.7);sun.position.set(8,18,6);sun.castShadow=true;scene.add(sun);buildMap();spawnWave();renderer.setAnimationLoop(update)}
function box(x,y,z,w,h,d,color,solid=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);if(solid){m.userData.box=new THREE.Box3().setFromObject(m);collisionObstacles.push(m)}return m}
function buildMap(){box(0,-.25,0,42,.5,42,0x252a2d,false);box(0,2.5,-21,42,5,1,0x31383d);box(0,2.5,21,42,5,1,0x31383d);box(-21,2.5,0,1,5,42,0x31383d);box(21,2.5,0,1,5,42,0x31383d);box(0,2.5,2,18,5,.7,0x343a40);box(-8,2.5,-9,.7,5,16,0x343a40);box(10,2.5,-8,.7,5,17,0x343a40);
addInteractive('Power Switch',new THREE.Vector3(15,1.4,-14),'toggle Power Switch',0,'power',0xe33b32);addInteractive('Juggernog',new THREE.Vector3(14,1.3,-7),'buy Juggernog',2500,'jug',0xd72e2e);addInteractive('Speed Cola',new THREE.Vector3(14,1.3,3),'buy Speed Cola',3000,'speed',0x41b75e);addInteractive('Pack-a-Punch',new THREE.Vector3(-14,1.3,-13),'upgrade current weapon',5000,'pap',0x9458d6);addInteractive('Mystery Box',new THREE.Vector3(-14,.7,10),'open Mystery Box',950,'mystery',0x674092);addInteractive('GobbleGum Machine',new THREE.Vector3(6,1.2,14),'buy a random GobbleGum',500,'gum',0x39c2d7);addWallBuy('RK5 Wall Buy',new THREE.Vector3(.0,1.5,2.46),new THREE.Vector3(0,0,1),750,'rk5');
const debris=box(-8,1.2,4,2.2,2.4,1.2,0x66452e);debris.userData.breakable=true;addExistingInteractive('Debris Blockade',debris,'clear Debris Blockade',1250,'debris');}
function addWallBuy(name,pos,normal,cost,gun){const offset=pos.clone().addScaledVector(normal,.12);const m=box(offset.x,offset.y,offset.z,1.8,.7,.15,0x96d7ff,false);m.userData.gun=gun;addExistingInteractive(name,m,'buy '+name,cost,'wallbuy')}
function addInteractive(name,pos,action,cost,type,color){const m=box(pos.x,pos.y,pos.z,1.35,2.2,1.15,color,false);addExistingInteractive(name,m,action,cost,type);return m}
function addExistingInteractive(name,mesh,action,cost,type){mesh.userData.interactive={name,action,cost,type,active:true};interactives.push(mesh)}
function entityBox(pos,r,h=1.8){return new THREE.Box3(new THREE.Vector3(pos.x-r,pos.y-h+.05,pos.z-r),new THREE.Vector3(pos.x+r,pos.y+.1,pos.z+r))}
function blocked(pos,r,h){const b=entityBox(pos,r,h);return collisionObstacles.some(o=>o.visible!==false&&o.userData.box&&b.intersectsBox(o.userData.box))}
function slideMove(pos,vel,dt,r,h){let p=pos.clone();let nx=p.clone();nx.x+=vel.x*dt;if(!blocked(nx,r,h))p.x=nx.x;else vel.x=0;let nz=p.clone();nz.z+=vel.z*dt;if(!blocked(nz,r,h))p.z=nz.z;else vel.z=0;return p}
function spawnWave(){roundTarget=5+round;for(let i=0;i<Math.min(3+round,10);i++)setTimeout(spawnZombie,i*700)}
function spawnZombie(){if(!gameStarted)return;const a=Math.random()*Math.PI*2,r=18;let p=new THREE.Vector3(Math.cos(a)*r,1.9,Math.sin(a)*r);if(blocked(p,.48,1.9))p.set(18,1.9,-18);const g=new THREE.Group();g.position.copy(p);const torso=new THREE.Mesh(new THREE.BoxGeometry(.9,1.0,.48),mat(0x52633d));torso.position.y=-.65;const head=new THREE.Mesh(new THREE.BoxGeometry(.62,.62,.62),mat(0x7b844a));head.position.y=.2;head.userData.isHead=true;const la=limb(.22,.85,0x495b37),ra=limb(.22,.85,0x495b37);la.position.set(-.62,-.65,0);ra.position.set(.62,-.65,0);const ll=limb(.28,.92,0x30352b),rl=limb(.28,.92,0x30352b);ll.position.set(-.25,-1.5,0);rl.position.set(.25,-1.5,0);g.add(torso,head,la,ra,ll,rl);scene.add(g);let type=round<=2?'limper':round<=5?'walker':Math.random()<.6?'runner':'walker';let speed=type==='limper'?1.05:type==='walker'?1.65:Math.min(3.75,player.sprintSpeed-.25);const z={group:g,head,torso,la,ra,ll,rl,type,speed,health:round>5?120:90,phase:Math.random()*6.28,radius:.48,lastHit:0,dead:false,banner:null};if(isEasterEggActive)applyEgg(z);zombies.push(z)}
function limb(w,h,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),mat(c));m.castShadow=true;return m}
function updateZombie(z,dt,t){if(z.dead)return;const d=player.position.clone().sub(z.group.position);d.y=0;const dist=d.length();if(dist>.01)d.normalize();const vel=d.multiplyScalar(z.speed);z.group.position.copy(slideMove(z.group.position,vel,dt,z.radius,1.9));z.group.lookAt(player.position.x,z.group.position.y,player.position.z);const f=z.type==='runner'?11:z.type==='walker'?6:4,amp=z.type==='runner'?1.0:z.type==='walker'?.55:.75,s=Math.sin(t*f+z.phase);if(z.type==='limper'){z.ll.rotation.x=s*amp;z.rl.rotation.x=-s*.2;z.torso.rotation.z=.22+Math.sin(t*2)*.12}else{z.ll.rotation.x=s*amp;z.rl.rotation.x=-s*amp;z.la.rotation.x=-s*amp*.7;z.ra.rotation.x=s*amp*.7;z.group.position.y=1.9+Math.abs(s)*(z.type==='runner'?.11:.04);z.torso.rotation.z=0}if(z.banner){z.banner.position.copy(z.group.position).add(new THREE.Vector3(0,1.2,0));z.banner.lookAt(camera.position)}if(dist<1.25&&performance.now()-z.lastHit>850){z.lastHit=performance.now();damagePlayer(round>8?18:12)}}
function damagePlayer(n){if(player.god)return;player.health=Math.max(0,player.health-n);$('damage').style.opacity=.35;setTimeout(()=>$('damage').style.opacity=0,100);if(player.health<=0){showMessage('YOU DIED — refreshing...',2500);gameStarted=false;document.exitPointerLock();setTimeout(()=>location.reload(),2600)}updateHUD()}
function shoot(){if(!gameStarted||document.pointerLockElement!==renderer.domElement||isReloading||isFiring)return;const w=weapons[inventory[currentWeapon]];if(w.currentClip<=0){reload();return}w.currentClip--;isFiring=true;setTimeout(()=>isFiring=false,w.fireRate);const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const targets=[];zombies.filter(z=>!z.dead).forEach(z=>z.group.traverse(o=>{if(o.isMesh){o.userData.owner=z;targets.push(o)}}));const hit=ray.intersectObjects(targets,false)[0];if(hit){const z=hit.object.userData.owner;const mult=hit.object.userData.isHead?2:1;hitZombie(z,w.damage*mult)}if(w.currentClip===0)setTimeout(reload,100);updateHUD()}
function hitZombie(z,dmg){if(z.dead)return;z.health-=dmg;player.points+=10;if(z.health<=0)killZombie(z);updateHUD()}
function killZombie(z){z.dead=true;player.points+=100;killsThisRound++;z.group.children.forEach((part,i)=>{part.position.x+=(i-2)*.08;part.rotation.x=Math.random()*2;part.rotation.z=Math.random()*2});let fall=0;const id=setInterval(()=>{fall+=.06;z.group.rotation.z=Math.min(1.55,z.group.rotation.z+.1);z.group.position.y=Math.max(.65,z.group.position.y-.08);if(fall>2){clearInterval(id);scene.remove(z.group);if(z.banner)scene.remove(z.banner)}},30);if(killsThisRound>=roundTarget){round++;killsThisRound=0;player.points+=500;showMessage('ROUND '+round,1800);setTimeout(spawnWave,2500)}else setTimeout(spawnZombie,1200);updateHUD()}
function reload(){const w=weapons[inventory[currentWeapon]];if(isReloading||w.currentClip>=w.clipMax||w.reserveAmmo<=0)return;isReloading=true;showMessage('RELOADING',w.reload);const duration=player.speedCola?1000:w.reload;reloadTimer=setTimeout(()=>{const need=w.clipMax-w.currentClip,take=w.reserveAmmo===Infinity?need:Math.min(need,w.reserveAmmo);w.currentClip+=take;if(w.reserveAmmo!==Infinity)w.reserveAmmo-=take;isReloading=false;updateHUD()},duration)}
function switchWeapon(){if(inventory.length<2)return;if(reloadTimer)clearTimeout(reloadTimer);isReloading=false;currentWeapon=(currentWeapon+1)%inventory.length;updateHUD()}
function updatePlayer(dt){const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();const move=new THREE.Vector3();if(keysPressed.KeyW)move.add(forward);if(keysPressed.KeyS)move.sub(forward);if(keysPressed.KeyD)move.add(right);if(keysPressed.KeyA)move.sub(right);if(move.lengthSq())move.normalize();const speed=(keysPressed.ShiftLeft||keysPressed.ShiftRight)?player.sprintSpeed:player.walkSpeed;const vel=move.multiplyScalar(speed);player.position.copy(slideMove(player.position,vel,dt,player.radius,player.height));if(player.grounded&&keysPressed.Space){player.yVelocity=.15;player.grounded=false;keysPressed.Space=false}if(!player.grounded){const frameScale=Math.min(dt*60,2);player.yVelocity-=.0075*frameScale;player.position.y+=player.yVelocity*frameScale;if(player.position.y<=player.height){player.position.y=player.height;player.yVelocity=0;player.grounded=true}}camera.position.copy(player.position);camera.rotation.y=yaw;camera.rotation.x=pitch}
function updateInteractions(){nearestInteractive=null;let best=3.000001;for(const m of interactives){if(!m.userData.interactive.active)continue;const d=player.position.distanceTo(m.getWorldPosition(new THREE.Vector3()));if(d<=3&&d<best){best=d;nearestInteractive=m}}$('prompt').textContent=nearestInteractive?`Press 'E' to ${nearestInteractive.userData.interactive.action}${nearestInteractive.userData.interactive.cost?` [Cost: ${nearestInteractive.userData.interactive.cost} pts]`:''}`:''}
function interact(){if(!nearestInteractive)return;const i=nearestInteractive.userData.interactive;if(i.cost>player.points){showMessage('NOT ENOUGH POINTS');return}if(['jug','speed','pap'].includes(i.type)&&!powerOn){showMessage('POWER MUST BE ACTIVATED');return}if(i.type==='power'){powerOn=true;i.active=false;nearestInteractive.material.emissive.setHex(0x22aa44);showMessage('POWER ONLINE');updateHUD();return}player.points-=i.cost;if(i.type==='debris'){nearestInteractive.visible=false;nearestInteractive.userData.box=null;i.active=false;const ix=collisionObstacles.indexOf(nearestInteractive);if(ix>=0)collisionObstacles.splice(ix,1);showMessage('PATH CLEARED')}else if(i.type==='jug'){player.health=200;player.maxHealth=200;i.active=false;showMessage('JUGGERNOG ACQUIRED')}else if(i.type==='speed'){player.speedCola=true;i.active=false;showMessage('SPEED COLA ACQUIRED')}else if(i.type==='pap'){weapons[inventory[currentWeapon]].damage*=2;showMessage('WEAPON PACKED')}else if(i.type==='wallbuy'){if(!inventory.includes('rk5'))inventory.push('rk5');else weapons.rk5.reserveAmmo+=60;showMessage('RK5 READY')}else if(i.type==='mystery'){if(!inventory.includes('ray'))inventory.push('ray');showMessage('MYSTERY BOX: RAY GUN!')}else if(i.type==='gum'){player.health=Math.min(player.maxHealth||100,player.health+50);showMessage('GOBBLEGUM: HEALING BURST')}updateHUD()}
function useTactical(type){const now=performance.now()/1000;if(selectedTactical!==type||cooldowns[type]>now)return;cooldowns[type]=now+(type==='frag'?15:type==='acid'?20:60);if(type==='sentry'){spawnTurret();return}const dir=new THREE.Vector3();camera.getWorldDirection(dir);const mesh=new THREE.Mesh(new THREE.SphereGeometry(.18,12,8),mat(type==='acid'?0x33ff55:0x333333,type==='acid'?0x116622:0));mesh.position.copy(player.position).add(dir);scene.add(mesh);projectiles.push({mesh,vel:dir.multiplyScalar(12).add(new THREE.Vector3(0,3,0)),type,born:now})}
function explode(p,type){const radius=type==='acid'?4:5;zombies.forEach(z=>{if(!z.dead&&z.group.position.distanceTo(p)<radius)hitZombie(z,type==='acid'?70:180)});if(type==='acid'){const puddle=new THREE.Mesh(new THREE.CylinderGeometry(3,3,.05,28),new THREE.MeshStandardMaterial({color:0x25ff52,emissive:0x118833,transparent:true,opacity:.65}));puddle.position.set(p.x,.04,p.z);scene.add(puddle);hazards.push({mesh:puddle,end:performance.now()/1000+5,last:0})}}
function spawnTurret(){const g=new THREE.Group();g.position.set(player.position.x,.55,player.position.z);const base=new THREE.Mesh(new THREE.CylinderGeometry(.6,.7,.3,12),mat(0x555b61));const gun=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,1.2),mat(0x22262a));gun.position.set(0,.55,-.35);g.add(base,gun);scene.add(g);turrets.push({group:g,gun,end:performance.now()/1000+30,last:0})}
function updateSpecials(dt,now){for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.vel.y-=9.8*dt;p.mesh.position.addScaledVector(p.vel,dt);const contact=p.mesh.position.y<=.15||blocked(p.mesh.position,.18,.36);if((p.type==='frag'&&now-p.born>=3)||(p.type==='acid'&&contact)){explode(p.mesh.position,p.type);scene.remove(p.mesh);projectiles.splice(i,1)}}for(let i=hazards.length-1;i>=0;i--){const h=hazards[i];if(now>h.end){scene.remove(h.mesh);hazards.splice(i,1);continue}if(now-h.last>.5){h.last=now;zombies.forEach(z=>{if(!z.dead&&z.group.position.distanceTo(h.mesh.position)<3.2)hitZombie(z,22)})}}for(let i=turrets.length-1;i>=0;i--){const t=turrets[i];if(now>t.end){scene.remove(t.group);turrets.splice(i,1);continue}let target=null,bd=12;zombies.forEach(z=>{const d=z.group.position.distanceTo(t.group.position);if(!z.dead&&d<bd){bd=d;target=z}});if(target){t.group.lookAt(target.group.position.x,t.group.position.y,target.group.position.z);if(now-t.last>.22){t.last=now;hitZombie(target,24)}}}}
function faceTexture(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#d29d71';x.beginPath();x.arc(128,135,78,0,Math.PI*2);x.fill();x.fillStyle='#17120f';for(let a=0;a<Math.PI*2;a+=.3){const r=a<Math.PI?83:72;x.beginPath();x.arc(128+Math.cos(a)*r,105+Math.sin(a)*r*.65,24,0,Math.PI*2);x.fill()}x.fillStyle='#fff';x.beginPath();x.arc(101,128,13,0,Math.PI*2);x.arc(155,128,13,0,Math.PI*2);x.fill();x.fillStyle='#222';x.beginPath();x.arc(103,129,5,0,7);x.arc(153,129,5,0,7);x.fill();x.strokeStyle='#652f2f';x.lineWidth=7;x.beginPath();x.arc(128,154,34,.2,Math.PI-.2);x.stroke();x.fillStyle='#d29d71';x.beginPath();x.ellipse(112,211,48,18,-.4,0,Math.PI*2);x.fill();return new THREE.CanvasTexture(c)}
function textSprite(text){const c=document.createElement('canvas');c.width=768;c.height=128;const x=c.getContext('2d');x.font='bold 52px monospace';x.textAlign='center';x.fillStyle='#ff3b3b';x.strokeStyle='#000';x.lineWidth=8;x.strokeText(text,384,78);x.fillText(text,384,78);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(5,0.84,1);scene.add(s);return s}
function applyEgg(z){z.head.material=new THREE.MeshStandardMaterial({map:faceTexture()});z.banner=textSprite('HE IS WATCHING...')}
function activateEgg(){if(isEasterEggActive)return;isEasterEggActive=true;zombies.forEach(applyEgg);$('cheats').classList.remove('hidden');document.exitPointerLock();showMessage('HE IS WATCHING...',2500)}
function showMessage(s,ms=1300){$('message').textContent=s;clearTimeout(showMessage.t);showMessage.t=setTimeout(()=>$('message').textContent='',ms)}
function updateHUD(){const w=weapons[inventory[currentWeapon]||selectedGun];$('points').textContent=player.points;$('health').textContent=Math.ceil(player.health);$('healthFill').style.width=(Math.min(100,player.health/(player.maxHealth||100)*100))+'%';$('power').textContent='POWER: '+(powerOn?'ON':'OFF');$('power').style.color=powerOn?'#63ff8d':'#ff4d4d';$('roundNum').textContent=round;$('weaponName').textContent=w.name+(isReloading?' [RELOADING]':'');$('clip').textContent=w.currentClip;$('reserve').textContent=w.reserveAmmo===Infinity?'∞':w.reserveAmmo}
function update(){if(!gameStarted)return;const dt=Math.min(clock.getDelta(),.035),t=performance.now()/1000;updatePlayer(dt);zombies.forEach(z=>updateZombie(z,dt,t));updateInteractions();updateSpecials(dt,t);renderer.render(scene,camera)}
window.addEventListener('keydown',e=>{keysPressed[e.code]=true;if(!gameStarted)return;if(e.code===secret[seqIndex]){seqIndex++;if(seqIndex===secret.length){seqIndex=0;activateEgg()}}else seqIndex=e.code===secret[0]?1:0;if(e.repeat)return;if(e.code==='KeyE')interact();if(e.code==='KeyR')reload();if(e.code==='KeyQ')switchWeapon();if(e.code==='KeyG')useTactical('frag');if(e.code==='KeyF')useTactical('acid');if(e.code==='KeyV')useTactical('sentry')});window.addEventListener('keyup',e=>keysPressed[e.code]=false);window.addEventListener('mousedown',e=>{if(e.button===0)shoot()});window.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer?.domElement){yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-Math.PI/2+.02,Math.min(Math.PI/2-.02,pitch))}});document.body.addEventListener('click',e=>{if(gameStarted&&!(!$('cheats').classList.contains('hidden'))&&e.target.tagName!=='BUTTON'&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock()});window.addEventListener('resize',()=>{if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
$('maxPoints').onclick=()=>{player.points=999999;updateHUD()};$('godMode').onclick=()=>{player.god=!player.god;$('godMode').textContent='GOD MODE: '+(player.god?'ON':'OFF')};$('unlockDoors').onclick=()=>{collisionObstacles.filter(o=>o.userData.breakable).forEach(o=>{o.visible=false;o.userData.box=null});interactives.filter(i=>i.userData.interactive.type==='debris').forEach(i=>i.userData.interactive.active=false);showMessage('ALL DOORS UNLOCKED')};$('rayGun').onclick=()=>{if(!inventory.includes('ray'))inventory.push('ray');currentWeapon=inventory.indexOf('ray');updateHUD()};$('closeCheats').onclick=()=>{$('cheats').classList.add('hidden');renderer.domElement.requestPointerLock()};
</script></body></html>
