<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e1e2f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .game {
      background: #303044;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0,0,0,.4);
      text-align: center;
      max-width: 95vw;
    }

    h1 {
      margin: 0 0 15px;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    select, button {
      border: none;
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 15px;
      cursor: pointer;
    }

    button {
      background: #5865f2;
      color: white;
    }

    button:hover {
      background: #4752c4;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: bold;
    }

    #board {
      display: grid;
      gap: 2px;
      background: #111;
      padding: 2px;
      margin: auto;
      width: fit-content;
      max-width: 90vw;
      overflow: auto;
    }

    .cell {
      width: 32px;
      height: 32px;
      border: 0;
      background: #777;
      color: white;
      font-weight: bold;
      font-size: 17px;
      padding: 0;
      cursor: pointer;
      border-radius: 3px;
      user-select: none;
    }

    .cell:hover {
      background: #888;
    }

    .revealed {
      background: #c7c7c7;
      color: #111;
      cursor: default;
    }

    .mine {
      background: #e74c3c;
    }

    .flagged {
      background: #f1c40f;
      color: #111;
    }

    .n1 { color: #1976d2; }
    .n2 { color: #388e3c; }
    .n3 { color: #d32f2f; }
    .n4 { color: #512da8; }
    .n5 { color: #795548; }
    .n6 { color: #00838f; }
    .n7 { color: #222; }
    .n8 { color: #666; }

    #message {
      margin-top: 15px;
      min-height: 22px;
      font-weight: bold;
    }

    .instructions {
      color: #bbb;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="game">
  <h1>💣 Minesweeper</h1>

  <div class="controls">
    <select id="difficulty">
      <option value="easy">Easy — 9×9 / 10 mines</option>
      <option value="medium">Medium — 16×16 / 40 mines</option>
      <option value="hard">Hard — 30×16 / 99 mines</option>
    </select>

    <button onclick="newGame()">New Game</button>
  </div>

  <div class="stats">
    <span>💣 Mines: <span id="mineCount">10</span></span>
    <span>⏱️ Time: <span id="timer">0</span></span>
  </div>

  <div id="board"></div>

  <div id="message"></div>

  <div class="instructions">
    Left-click/tap to reveal • Right-click to flag
  </div>
</div>

<script>
  const settings = {
    easy:   { rows: 9,  cols: 9,  mines: 10 },
    medium: { rows: 16, cols: 16, mines: 40 },
    hard:   { rows: 16, cols: 30, mines: 99 }
  };

  let rows, cols, mineTotal;
  let board = [];
  let gameOver = false;
  let firstClick = true;
  let flags = 0;
  let elapsed = 0;
  let timerInterval = null;

  const boardElement = document.getElementById("board");
  const messageElement = document.getElementById("message");
  const mineCountElement = document.getElementById("mineCount");
  const timerElement = document.getElementById("timer");
  const difficultyElement = document.getElementById("difficulty");

  function newGame() {
    clearInterval(timerInterval);

    const difficulty = settings[difficultyElement.value];

    rows = difficulty.rows;
    cols = difficulty.cols;
    mineTotal = difficulty.mines;

    board = [];
    gameOver = false;
    firstClick = true;
    flags = 0;
    elapsed = 0;

    timerElement.textContent = "0";
    mineCountElement.textContent = mineTotal;
    messageElement.textContent = "";

    boardElement.innerHTML = "";
    boardElement.style.gridTemplateColumns =
      `repeat(${cols}, 32px)`;

    for (let r = 0; r < rows; r++) {
      board[r] = [];

      for (let c = 0; c < cols; c++) {
        const cell = {
          row: r,
          col: c,
          mine: false,
          revealed: false,
          flagged: false,
          number: 0
        };

        board[r][c] = cell;

        const element = document.createElement("button");
        element.className = "cell";
        element.dataset.row = r;
        element.dataset.col = c;

        element.addEventListener("click", () => {
          reveal(r, c);
        });

        element.addEventListener("contextmenu", event => {
          event.preventDefault();
          toggleFlag(r, c);
        });

        boardElement.appendChild(element);
      }
    }
  }

  function placeMines(safeRow, safeCol) {
    let placed = 0;

    while (placed < mineTotal) {
      const r = Math.floor(Math.random() * rows);
      const c = Math.floor(Math.random() * cols);

      // Keep the first clicked square safe.
      if (
        board[r][c].mine ||
        (r === safeRow && c === safeCol)
      ) {
        continue;
      }

      board[r][c].mine = true;
      placed++;
    }

    calculateNumbers();
  }

  function calculateNumbers() {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {

        if (board[r][c].mine) continue;

        let count = 0;

        forEachNeighbor(r, c, neighbor => {
          if (neighbor.mine) count++;
        });

        board[r][c].number = count;
      }
    }
  }

  function forEachNeighbor(row, col, callback) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {

        if (dr === 0 && dc === 0) continue;

        const r = row + dr;
        const c = col + dc;

        if (
          r >= 0 &&
          r < rows &&
          c >= 0 &&
          c < cols
        ) {
          callback(board[r][c]);
        }
      }
    }
  }

  function reveal(row, col) {
    if (gameOver) return;

    const cell = board[row][col];

    if (cell.revealed || cell.flagged) return;

    if (firstClick) {
      firstClick = false;
      placeMines(row, col);

      timerInterval = setInterval(() => {
        elapsed++;
        timerElement.textContent = elapsed;
      }, 1000);
    }

    cell.revealed = true;

    const element = getElement(row, col);
    element.classList.add("revealed");

    if (cell.mine) {
      element.textContent = "💣";
      element.classList.add("mine");
      loseGame();
      return;
    }

    if (cell.number > 0) {
      element.textContent = cell.number;
      element.classList.add(`n${cell.number}`);
    } else {
      forEachNeighbor(row, col, neighbor => {
        if (!neighbor.revealed && !neighbor.flagged) {
          reveal(neighbor.row, neighbor.col);
        }
      });
    }

    checkWin();
  }

  function toggleFlag(row, col) {
    if (gameOver) return;

    const cell = board[row][col];

    if (cell.revealed) return;

    const element = getElement(row, col);

    if (cell.flagged) {
      cell.flagged = false;
      flags--;
      element.textContent = "";
      element.classList.remove("flagged");
    } else {
      if (flags >= mineTotal) return;

      cell.flagged = true;
      flags++;
      element.textContent = "🚩";
      element.classList.add("flagged");
    }

    mineCountElement.textContent = mineTotal - flags;
    checkWin();
  }

  function checkWin() {
    let unrevealed = 0;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (!board[r][c].revealed) {
          unrevealed++;
        }
      }
    }

    if (unrevealed === mineTotal) {
      gameOver = true;
      clearInterval(timerInterval);

      // Automatically flag remaining mines.
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = board[r][c];

          if (cell.mine && !cell.flagged) {
            cell.flagged = true;
            flags++;

            const element = getElement(r, c);
            element.textContent = "🚩";
            element.classList.add("flagged");
          }
        }
      }

      mineCountElement.textContent = "0";
      messageElement.textContent =
        `🎉 You won in ${elapsed} seconds!`;
    }
  }

  function loseGame() {
    gameOver = true;
    clearInterval(timerInterval);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = board[r][c];

        if (cell.mine) {
          cell.revealed = true;

          const element = getElement(r, c);
          element.textContent = "💣";
          element.classList.add("revealed", "mine");
        }
      }
    }

    messageElement.textContent = "💥 Game over!";
  }

  function getElement(row, col) {
    return document.querySelector(
      `.cell[data-row="${row}"][data-col="${col}"]`
    );
  }

  difficultyElement.addEventListener("change", newGame);

  newGame();
</script>

</body>
</html>
